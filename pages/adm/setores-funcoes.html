<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10' stroke='%230b1d4d' stroke-width='2.5'/%3E%3Cpolyline points='12 6 12 12 16 14'/%3E%3C/svg%3E">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setores e Funções - Ponto Eletrônico</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/app.js"></script>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main-content">
  <div id="topbar-container"></div>

  <!-- SETORES -->
  <div style="margin-bottom:24px">
    <h2 style="font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
      Setores
    </h2>
    <div class="cadastro-split">
      <div class="panel" style="padding:22px">
        <h3 style="font-size:14px;font-weight:700;margin-bottom:16px" id="setTitle">Novo Setor</h3>
        <input type="hidden" id="setEditId">
        <div class="form-group"><label>Nome do Setor *</label>
          <input type="text" class="form-control" id="setNome" placeholder="Ex: TI">
        </div>
        <div class="form-group"><label>Empresa *</label>
          <select class="form-control" id="setEmpresa"></select>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="salvarSet()" style="flex:1">💾 Salvar Setor</button>
          <button class="btn btn-ghost" onclick="limparSet()">✖</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>Setores Cadastrados</h2><span id="setCount"></span>
        </div>
        <div style="padding:12px 16px;border-bottom:1px solid var(--border)">
          <input type="text" class="form-control" id="setSearch" placeholder="Pesquisar..." oninput="renderSet()">
        </div>
        <div id="setList"></div>
      </div>
    </div>
  </div>

  <!-- FUNÇÕES -->
  <div>
    <h2 style="font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Funções
    </h2>
    <div class="cadastro-split">
      <div class="panel" style="padding:22px">
        <h3 style="font-size:14px;font-weight:700;margin-bottom:16px" id="funcTitle">Nova Função</h3>
        <input type="hidden" id="funcEditId">
        <div class="form-group"><label>Nome da Função *</label>
          <input type="text" class="form-control" id="funcNome" placeholder="Ex: Desenvolvedor">
        </div>
        <div class="form-group"><label>Setor *</label>
          <select class="form-control" id="funcSetor"></select>
        </div>
        <div class="form-group"><label>Descrição</label>
          <input type="text" class="form-control" id="funcDesc" placeholder="Descrição breve">
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="salvarFunc()" style="flex:1">💾 Salvar Função</button>
          <button class="btn btn-ghost" onclick="limparFunc()">✖</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>Funções Cadastradas</h2><span id="funcCount"></span>
        </div>
        <div style="padding:12px 16px;border-bottom:1px solid var(--border)">
          <input type="text" class="form-control" id="funcSearch" placeholder="Pesquisar..." oninput="renderFunc()">
        </div>
        <div id="funcList"></div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  renderTopbar('Setores e Funções', 'Gerencie setores e funções associando as funções aos seus respectivos setores');
  fillEmpresas();
  fillSectors();
  renderSet();
  renderFunc();
});

function fillEmpresas() {
  const sel = document.getElementById('setEmpresa');
  sel.innerHTML = '<option value="">Selecione...</option>';
  DB.get('companies').forEach(c => sel.innerHTML += `<option value="${c.id}">${c.name}</option>`);
}

function fillSectors() {
  const sel = document.getElementById('funcSetor');
  sel.innerHTML = '<option value="">Selecione...</option>';
  DB.get('sectors').forEach(s => sel.innerHTML += `<option value="${s.id}">${s.name} (${getCompanyName(s.companyId)})</option>`);
}

/* ----- SETORES ----- */
function renderSet() {
  const q=(document.getElementById('setSearch').value||'').toLowerCase();
  const list=DB.get('sectors').filter(s=>s.name.toLowerCase().includes(q));
  document.getElementById('setCount').textContent=list.length;
  document.getElementById('setList').innerHTML=list.length?list.map(s=>`
    <div class="list-item">
      <div>
        <div style="font-weight:600">${s.name}</div>
        <div style="font-size:12px;color:var(--text-muted)">${getCompanyName(s.companyId)}</div>
      </div>
      <div class="list-item-actions">
        <button class="btn btn-ghost btn-sm" onclick="editarSet(${s.id})">✏</button>
        <button class="btn btn-danger btn-sm" onclick="excluirSet(${s.id})">🗑</button>
      </div>
    </div>`).join(''):'<div class="empty-state" style="padding:24px"><p>Nenhum setor</p></div>';
}

function salvarSet() {
  const nome=document.getElementById('setNome').value.trim();
  const companyId=parseInt(document.getElementById('setEmpresa').value)||null;
  if(!nome||!companyId){toast('Preencha nome e empresa','warning');return;}
  const list=DB.get('sectors');
  const id=parseInt(document.getElementById('setEditId').value)||null;
  if(id){
    const idx=list.findIndex(s=>s.id===id);
    if(idx>-1) list[idx]={...list[idx],name:nome,companyId};
    logAudit('Setor editado',nome);
    toast('Setor atualizado!');
  } else {
    list.push({id:nextId(list),name:nome,companyId});
    logAudit('Setor criado',nome);
    toast('Setor cadastrado!');
  }
  DB.set('sectors',list);
  limparSet();
  renderSet();
  fillSectors(); // Atualiza setores na função
}

function editarSet(id){
  const s=DB.get('sectors').find(x=>x.id===id);if(!s)return;
  document.getElementById('setEditId').value=id;
  document.getElementById('setNome').value=s.name;
  document.getElementById('setEmpresa').value=s.companyId||'';
  document.getElementById('setTitle').textContent='Editar Setor';
}

function excluirSet(id){
  const s=DB.get('sectors').find(x=>x.id===id);
  if(!confirm(`Excluir setor "${s?.name}"?`))return;
  DB.set('sectors',DB.get('sectors').filter(x=>x.id!==id));
  logAudit('Setor excluído',s?.name||'');toast('Excluído','error');
  renderSet();
  fillSectors();
}

function limparSet(){
  ['setEditId','setNome'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('setEmpresa').value='';
  document.getElementById('setTitle').textContent='Novo Setor';
}

/* ----- FUNÇÕES ----- */
function renderFunc() {
  const q = (document.getElementById('funcSearch').value||'').toLowerCase();
  const list = DB.get('functions').filter(f=>f.name.toLowerCase().includes(q));
  document.getElementById('funcCount').textContent = list.length;
  document.getElementById('funcList').innerHTML = list.length ? list.map(f=>`
    <div class="list-item">
      <div>
        <div style="font-weight:600">${f.name}</div>
        <div style="font-size:12px;color:var(--text-muted)">Setor: ${getSectorName(f.sectorId)} ${f.desc?' · '+f.desc:''}</div>
      </div>
      <div class="list-item-actions">
        <button class="btn btn-ghost btn-sm" onclick="editarFunc(${f.id})">✏</button>
        <button class="btn btn-danger btn-sm" onclick="excluirFunc(${f.id})">🗑</button>
      </div>
    </div>`).join('') : '<div class="empty-state" style="padding:24px"><p>Nenhuma função</p></div>';
}

function salvarFunc() {
  const nome = document.getElementById('funcNome').value.trim();
  const sectorId = parseInt(document.getElementById('funcSetor').value)||null;
  const desc = document.getElementById('funcDesc').value.trim();
  
  if (!nome || !sectorId) { toast('Preencha nome da função e setor', 'warning'); return; }
  
  const list = DB.get('functions');
  const id = parseInt(document.getElementById('funcEditId').value)||null;
  if (id) {
    const idx = list.findIndex(f=>f.id===id);
    if (idx>-1) list[idx]={...list[idx],name:nome,sectorId,desc};
    logAudit('Função editada', nome);
    toast('Função atualizada!');
  } else {
    list.push({id:nextId(list),name:nome,sectorId,desc});
    logAudit('Função criada', nome);
    toast('Função cadastrada!');
  }
  DB.set('functions',list); 
  limparFunc(); 
  renderFunc();
}

function editarFunc(id) {
  const f=DB.get('functions').find(x=>x.id===id); if(!f) return;
  document.getElementById('funcEditId').value=id;
  document.getElementById('funcNome').value=f.name;
  document.getElementById('funcSetor').value=f.sectorId||'';
  document.getElementById('funcDesc').value=f.desc||'';
  document.getElementById('funcTitle').textContent='Editar Função';
}

function excluirFunc(id) {
  const f=DB.get('functions').find(x=>x.id===id);
  if(!confirm(`Excluir função "${f?.name}"?`)) return;
  DB.set('functions',DB.get('functions').filter(x=>x.id!==id));
  logAudit('Função excluída',f?.name||''); toast('Excluída','error'); renderFunc();
}

function limparFunc() {
  ['funcEditId','funcNome','funcDesc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('funcSetor').value='';
  document.getElementById('funcTitle').textContent='Nova Função';
}
</script>
</body>
</html>
