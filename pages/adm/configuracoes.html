<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10' stroke='%230b1d4d' stroke-width='2.5'/%3E%3Cpolyline points='12 6 12 12 16 14'/%3E%3C/svg%3E">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configurações - Ponto Eletrônico</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/app.js"></script>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main-content">
  <div id="topbar-container"></div>

  <div class="grid-2" style="align-items:start">
    <!-- COLUNA ESQUERDA -->
    <div>
      <!-- Criar Aviso por Funcionário -->
      <div class="panel" style="padding:24px;margin-bottom:20px">
        <h3 style="font-size:14px;font-weight:700;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)">📢 Criar Novo Aviso por Funcionário</h3>
        
        <div class="form-group">
          <label>Título do Aviso *</label>
          <input type="text" class="form-control" id="avisoTitulo" placeholder="Ex: Manutenção agendada, Novo Feriado, etc.">
        </div>
        
        <div class="form-group">
          <label>Conteúdo do Aviso *</label>
          <textarea class="form-control" id="avisoConteudo" rows="4" placeholder="Escreva a mensagem que aparecerá ao usuário ao acessar o sistema..." style="resize:vertical; min-height:80px;"></textarea>
        </div>

        <div class="form-group">
          <label>Destinatários (Selecione um ou mais funcionários) *</label>
          <div id="avisoFuncList" style="display:flex; flex-direction:column; gap:6px; max-height:140px; overflow-y:auto; border:1.5px solid var(--border); border-radius:8px; padding:10px; background:#ffffff;">
            <!-- Injetado dinamicamente -->
          </div>
        </div>

        <button class="btn btn-primary" onclick="salvarAviso()" style="width:100%; justify-content:center; margin-top:8px;">📢 Publicar Aviso</button>
      </div>

      <!-- Tolerâncias/Regras de Ponto -->
      <div class="panel" style="padding:24px">
        <div class="settings-section">
          <h3>⏱ Regras de Ponto</h3>
          <div class="form-group"><label>Tolerância de Atraso</label>
            <select class="form-control" id="sTolerancia">
              <option value="5">5 minutos</option>
              <option value="10">10 minutos</option>
              <option value="15">15 minutos</option>
              <option value="0">Sem tolerância</option>
            </select>
          </div>
          <div class="form-group"><label>Tempo Mínimo para Hora Extra</label>
            <select class="form-control" id="sHoraExtra">
              <option value="5">5 minutos</option>
              <option value="10">10 minutos</option>
              <option value="15">15 minutos</option>
            </select>
          </div>
          <div class="form-group"><label>Considerar Banco de Horas?</label>
            <select class="form-control" id="sBanco">
              <option value="sim">Sim — acumular automaticamente</option>
              <option value="nao">Não — apenas registrar</option>
            </select>
          </div>
          <div class="form-group"><label>Limite Mensal de Horas Extras</label>
            <div style="display:flex;align-items:center;gap:8px">
              <input type="number" class="form-control" id="sLimiteExtra" min="0" max="100" placeholder="Ex: 20" style="flex:1">
              <span style="color:var(--text-muted);white-space:nowrap">horas/mês</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- COLUNA DIREITA -->
    <div>
      <!-- Avisos Ativos -->
      <div class="panel" style="padding:24px;margin-bottom:20px">
        <h3 style="font-size:14px;font-weight:700;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)">📋 Avisos Ativos no Sistema</h3>
        <div id="avisoList" style="display:flex; flex-direction:column; gap:10px; max-height: 280px; overflow-y:auto;">
          <!-- Injetado dinamicamente -->
        </div>
      </div>

      <!-- Notificações -->
      <div class="panel" style="padding:24px;margin-bottom:20px">
        <div class="settings-section">
          <h3>🔔 Notificações de Alerta</h3>
          <div style="display:flex;flex-direction:column;gap:10px">
            <label class="checkbox-wrap"><input type="checkbox" id="nSolic" checked> Novas solicitações de acesso</label>
            <label class="checkbox-wrap"><input type="checkbox" id="nAtraso" checked> Funcionários com atraso</label>
            <label class="checkbox-wrap"><input type="checkbox" id="nExtra" checked> Horas extras acima do limite</label>
            <label class="checkbox-wrap"><input type="checkbox" id="nAdmin" checked> Alterações por administradores</label>
          </div>
        </div>
      </div>

      <!-- Ações -->
      <div class="panel" style="padding:24px">
        <h3 style="font-size:14px;font-weight:700;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)">🛠 Ações do Sistema</h3>
        <div style="display:flex;flex-direction:column;gap:10px">
          <button class="btn btn-primary" onclick="salvar()" style="justify-content:center">💾 Salvar Configurações</button>
          <button class="btn btn-ghost" onclick="resetarPadrao()" style="justify-content:center">↩ Restaurar Padrões</button>
          <button class="btn btn-danger" onclick="limparDados()" style="justify-content:center">🗑 Limpar Todos os Dados</button>
        </div>
        <div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--text-muted)">
          <strong>Versão:</strong> 1.0.0 &nbsp;|&nbsp;
          <strong>Banco:</strong> localStorage &nbsp;|&nbsp;
          <strong>Build:</strong> 2026.06
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  renderTopbar('Configurações', 'Personalize as regras de ponto e envie avisos para os funcionários');
  carregarConfig();
  fillFuncs();
  renderAvisos();
});

function carregarConfig() {
  const s = DB.getObj('settings', {});
  document.getElementById('sTolerancia').value  = s.delayTolerance||'10';
  document.getElementById('sHoraExtra').value   = s.overtimeMinimum||'10';
  document.getElementById('sBanco').value       = s.bankEnabled||'sim';
  document.getElementById('sLimiteExtra').value = s.overtimeLimit||'';
}

function salvar() {
  const s = {
    systemName:     'Ponto Eletrônico',
    senderEmail:    'noreply@pontoeletronico.com',
    primaryColor:   '#0b1d4d',
    secondaryColor: '#2563EB',
    delayTolerance: document.getElementById('sTolerancia').value,
    overtimeMinimum:document.getElementById('sHoraExtra').value,
    bankEnabled:    document.getElementById('sBanco').value,
    overtimeLimit:  document.getElementById('sLimiteExtra').value,
  };
  DB.setObj('settings', s);
  toast('Configurações de regras de ponto salvas com sucesso!');
}

function resetarPadrao() {
  if (!confirm('Restaurar configurações padrão?')) return;
  DB.setObj('settings', { systemName:'Ponto Eletrônico', primaryColor:'#0b1d4d', secondaryColor:'#2563EB', senderEmail:'noreply@pontoeletronico.com', delayTolerance:'10', overtimeMinimum:'10', bankEnabled:'sim' });
  carregarConfig();
  toast('Configurações restauradas!');
}

function limparDados() {
  if (!confirm('ATENÇÃO: Isso irá apagar TODOS os dados do sistema. Esta ação é irreversível!\n\nDeseja continuar?')) return;
  if (!confirm('Tem certeza absoluta? Todos os registros, usuários e configurações serão perdidos.')) return;
  localStorage.clear();
  toast('Dados limpos. Recarregando...','error');
  setTimeout(()=>location.href='/index.html', 1500);
}

/* ===================== GERENCIAMENTO DE AVISOS POR FUNCIONÁRIO ===================== */
function fillFuncs() {
  const list = DB.get('users').filter(u => u.status === 'ativo');
  document.getElementById('avisoFuncList').innerHTML = list.map(u => `
    <label class="checkbox-wrap">
      <input type="checkbox" name="avisoUser" value="${u.id}">
      ${u.name} (${u.role === 'admin' ? 'Admin' : u.role === 'supervisor' ? 'Supervisor' : 'Funcionário'})
    </label>`).join('') || '<div style="color:var(--text-muted);font-size:12px;">Nenhum funcionário ativo cadastrado</div>';
}

function renderAvisos() {
  const list = DB.get('announcements') || [];
  const users = DB.get('users');
  const listDiv = document.getElementById('avisoList');
  
  listDiv.innerHTML = list.length ? list.map(a => {
    // Obter nomes dos destinatários
    const targetNames = (a.userIds || []).map(id => users.find(u => u.id === id)?.name).filter(Boolean).join(', ');
    
    return `
    <div class="list-item" style="padding:12px;border: 1.5px solid var(--border); border-radius: 8px; display:flex;justify-content:space-between;align-items:center;background:#ffffff;">
      <div style="flex:1; padding-right:12px;">
        <div style="font-weight:700;font-size:13.5px;color:var(--primary)">${a.title}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">
          Destinatários: ${targetNames || 'Nenhum'}
        </div>
        <div style="font-size:12px;color:var(--text);margin-top:6px;line-height:1.4;">${a.content.substring(0, 60)}${a.content.length > 60 ? '...' : ''}</div>
      </div>
      <button class="btn btn-danger btn-sm" onclick="excluirAviso(${a.id})" style="padding:6px 10px; flex-shrink:0;">🗑</button>
    </div>`;
  }).join('') : '<div class="empty-state" style="padding:20px; border: 1.5px dashed var(--border); border-radius: 8px;"><p>Nenhum aviso ativo</p></div>';
}

function salvarAviso() {
  const title = document.getElementById('avisoTitulo').value.trim();
  const content = document.getElementById('avisoConteudo').value.trim();
  const userIds = [...document.querySelectorAll('input[name=avisoUser]:checked')].map(c => parseInt(c.value));
  
  if (!title || !content) { toast('Preencha título e conteúdo do aviso', 'warning'); return; }
  if (!userIds.length) { toast('Selecione pelo menos um funcionário destinatário', 'warning'); return; }
  
  const list = DB.get('announcements') || [];
  list.unshift({
    id: Date.now(),
    title,
    content,
    userIds,
    date: new Date().toLocaleDateString('pt-BR')
  });
  
  DB.set('announcements', list);
  toast('Aviso publicado com sucesso!');
  
  // Limpar campos
  document.getElementById('avisoTitulo').value = '';
  document.getElementById('avisoConteudo').value = '';
  document.querySelectorAll('input[name=avisoUser]').forEach(c => c.checked = false);
  
  renderAvisos();
}

function excluirAviso(id) {
  if (!confirm('Deseja excluir este aviso?')) return;
  const list = DB.get('announcements') || [];
  const filtered = list.filter(a => a.id !== id);
  DB.set('announcements', filtered);
  toast('Aviso removido!', 'error');
  renderAvisos();
}
</script>
</body>
</html>
