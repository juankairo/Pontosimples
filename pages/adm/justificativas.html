<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10' stroke='%230b1d4d' stroke-width='2.5'/%3E%3Cpolyline points='12 6 12 12 16 14'/%3E%3C/svg%3E">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Justificativas - Ponto Eletrônico</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/app.js"></script>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main-content">
  <div id="topbar-container"></div>

  <div class="cadastro-split">
    <!-- FORMULÁRIO -->
    <div class="panel" style="padding:22px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px" id="formTitle">Nova Justificativa</h3>
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>Nome da Justificativa *</label>
        <input type="text" class="form-control" id="inputNome" placeholder="Ex: Atestado Médico">
      </div>
      <div class="form-group">
        <label>Descrição</label>
        <input type="text" class="form-control" id="inputDesc" placeholder="Detalhes adicionais (opcional)">
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select class="form-control" id="inputTipo">
          <option value="ausencia">Ausência</option>
          <option value="atraso">Atraso</option>
          <option value="saida">Saída Antecipada</option>
          <option value="geral">Geral</option>
        </select>
      </div>
      <div class="form-group">
        <label>Requer Documento?</label>
        <select class="form-control" id="inputDoc">
          <option value="nao">Não</option>
          <option value="sim">Sim</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="salvar()" style="width:100%;margin-bottom:8px">
        ➕ <span id="btnLabel">Adicionar</span>
      </button>
      <button class="btn btn-ghost" onclick="limpar()" style="width:100%">✖ Cancelar</button>
    </div>

    <!-- LISTA -->
    <div class="panel">
      <div class="panel-header">
        <h2>Justificativas Cadastradas</h2>
        <span id="count"></span>
      </div>
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px">
        <input type="text" class="form-control" id="search" placeholder="Pesquisar..." oninput="render()" style="flex:1">
        <select class="form-control" id="fTipo" onchange="render()" style="width:140px">
          <option value="">Todos tipos</option>
          <option value="ausencia">Ausência</option>
          <option value="atraso">Atraso</option>
          <option value="saida">Saída Antecipada</option>
          <option value="geral">Geral</option>
        </select>
      </div>
      <div id="listWrap"></div>
    </div>
  </div>
</div>

<script>
const tipoLabel = { ausencia:'Ausência', atraso:'Atraso', saida:'Saída Antecipada', geral:'Geral' };
const tipoColor = { ausencia:'var(--danger)', atraso:'var(--warning)', saida:'var(--purple)', geral:'var(--info)' };
const tipoBg = { ausencia:'var(--danger-bg)', atraso:'var(--warning-bg)', saida:'var(--purple-bg)', geral:'var(--info-bg)' };

document.addEventListener('DOMContentLoaded', () => {
  renderTopbar('Justificativas', 'Tipos de justificativa de ponto');
  render();
});

function render() {
  const q = (document.getElementById('search').value||'').toLowerCase();
  const tipo = document.getElementById('fTipo').value;
  const list = DB.get('justifications').filter(j =>
    (!q || j.name.toLowerCase().includes(q)) && (!tipo || (j.tipo||'geral')===tipo)
  );
  document.getElementById('count').textContent = list.length + ' justificativas';
  document.getElementById('listWrap').innerHTML = list.length ? list.map(j=>`
    <div class="list-item">
      <div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-weight:700">${j.name}</span>
          <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:${tipoBg[j.tipo||'geral']};color:${tipoColor[j.tipo||'geral']}">${tipoLabel[j.tipo||'geral']}</span>
          ${j.doc==='sim'?'<span style="font-size:11px;color:var(--warning)">📎 Requer doc.</span>':''}
        </div>
        ${j.desc?`<div style="font-size:12px;color:var(--text-muted);margin-top:3px">${j.desc}</div>`:''}
      </div>
      <div class="list-item-actions">
        <button class="btn btn-ghost btn-sm" onclick="editar(${j.id})">✏</button>
        <button class="btn btn-danger btn-sm" onclick="excluir(${j.id})">🗑</button>
      </div>
    </div>`).join('') : '<div class="empty-state" style="padding:32px"><p>Nenhuma justificativa encontrada</p></div>';
}

function salvar() {
  const nome = document.getElementById('inputNome').value.trim();
  const desc = document.getElementById('inputDesc').value.trim();
  const tipo = document.getElementById('inputTipo').value;
  const doc  = document.getElementById('inputDoc').value;
  if (!nome) { toast('Informe o nome da justificativa','warning'); return; }

  const list = DB.get('justifications');
  const id = parseInt(document.getElementById('editId').value)||null;
  if (id) {
    const idx=list.findIndex(j=>j.id===id);
    if(idx>-1) list[idx]={...list[idx],name:nome,desc,tipo,doc};
    logAudit('Justificativa editada',nome); toast('Justificativa atualizada!');
  } else {
    list.push({id:nextId(list),name:nome,desc,tipo,doc});
    logAudit('Justificativa adicionada',nome); toast('Justificativa cadastrada!');
  }
  DB.set('justifications',list); limpar(); render();
}

function editar(id) {
  const j=DB.get('justifications').find(x=>x.id===id); if(!j) return;
  document.getElementById('editId').value=id;
  document.getElementById('inputNome').value=j.name;
  document.getElementById('inputDesc').value=j.desc||'';
  document.getElementById('inputTipo').value=j.tipo||'geral';
  document.getElementById('inputDoc').value=j.doc||'nao';
  document.getElementById('formTitle').textContent='Editar Justificativa';
  document.getElementById('btnLabel').textContent='Salvar';
}

function excluir(id) {
  const j=DB.get('justifications').find(x=>x.id===id);
  if(!confirm(`Excluir "${j?.name}"?`)) return;
  DB.set('justifications',DB.get('justifications').filter(x=>x.id!==id));
  logAudit('Justificativa excluída',j?.name||''); toast('Excluída','error'); render();
}

function limpar(){
  ['editId','inputNome','inputDesc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('inputTipo').value='ausencia';
  document.getElementById('inputDoc').value='nao';
  document.getElementById('formTitle').textContent='Nova Justificativa';
  document.getElementById('btnLabel').textContent='Adicionar';
}
</script>
</body>
</html>
