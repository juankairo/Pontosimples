<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10' stroke='%230b1d4d' stroke-width='2.5'/%3E%3Cpolyline points='12 6 12 12 16 14'/%3E%3C/svg%3E">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empresas - Ponto Eletrônico</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/app.js"></script>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main-content">
  <div id="topbar-container"></div>

  <div class="cadastro-split">
    <!-- FORMULÁRIO -->
    <div class="panel" style="padding:24px">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:20px" id="formTitle">Nova Empresa</h2>
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>Nome da Empresa *</label>
        <input type="text" class="form-control" id="inputNome" placeholder="Ex: Stylle Ltda">
      </div>
      <div class="form-group">
        <label>Endereço *</label>
        <input type="text" class="form-control" id="inputEndereco" placeholder="Rua, número - Cidade/UF">
      </div>
      <div class="form-group">
        <label>CNPJ</label>
        <input type="text" class="form-control" id="inputCnpj" placeholder="00.000.000/0000-00">
      </div>
      <div class="form-group">
        <label>Telefone</label>
        <input type="text" class="form-control" id="inputTel" placeholder="(00) 00000-0000">
      </div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn btn-primary" onclick="salvar()" style="flex:1">💾 Salvar</button>
        <button class="btn btn-ghost" onclick="limpar()">✖ Cancelar</button>
      </div>
    </div>

    <!-- LISTA -->
    <div class="panel">
      <div class="panel-header">
        <h2>Empresas Cadastradas</h2>
        <span id="count">0 empresas</span>
      </div>
      <div style="padding:14px 18px;border-bottom:1px solid var(--border)">
        <div class="search-wrap">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" class="form-control" id="search" placeholder="Pesquisar empresa..." oninput="render()" style="padding-left:34px">
        </div>
      </div>
      <div id="listWrap"></div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  renderTopbar('Empresas', 'Cadastro de empresas');
  render();
});

function render() {
  const q = (document.getElementById('search').value||'').toLowerCase();
  const list = DB.get('companies').filter(c=>c.name.toLowerCase().includes(q)||c.address.toLowerCase().includes(q));
  document.getElementById('count').textContent = list.length + ' empresa(s)';
  document.getElementById('listWrap').innerHTML = list.length ? list.map(c=>`
    <div class="list-item">
      <div>
        <div style="font-weight:600;font-size:14px">${c.name}</div>
        <div style="font-size:12px;color:var(--text-muted)">${c.address}</div>
        ${c.cnpj?`<div style="font-size:11px;color:var(--text-muted)">CNPJ: ${c.cnpj}</div>`:''}
      </div>
      <div class="list-item-actions">
        <button class="btn btn-ghost btn-sm" onclick="editar(${c.id})">✏</button>
        <button class="btn btn-danger btn-sm" onclick="excluir(${c.id})">🗑</button>
      </div>
    </div>`).join('') : '<div class="empty-state" style="padding:32px"><p>Nenhuma empresa encontrada</p></div>';
}

function salvar() {
  const nome = document.getElementById('inputNome').value.trim();
  const end  = document.getElementById('inputEndereco').value.trim();
  const cnpj = document.getElementById('inputCnpj').value.trim();
  const tel  = document.getElementById('inputTel').value.trim();
  if (!nome||!end) { toast('Preencha nome e endereço', 'warning'); return; }

  const list = DB.get('companies');
  const id = parseInt(document.getElementById('editId').value)||null;

  if (id) {
    const idx = list.findIndex(c=>c.id===id);
    if (idx>-1) { list[idx]={...list[idx],name:nome,address:end,cnpj,tel}; }
    logAudit('Empresa editada', nome);
    toast('Empresa atualizada!');
  } else {
    list.push({ id:nextId(list), name:nome, address:end, cnpj, tel });
    logAudit('Empresa criada', nome);
    toast('Empresa cadastrada!');
  }
  DB.set('companies', list);
  limpar(); render();
}

function editar(id) {
  const c = DB.get('companies').find(x=>x.id===id);
  if (!c) return;
  document.getElementById('editId').value = id;
  document.getElementById('inputNome').value = c.name;
  document.getElementById('inputEndereco').value = c.address;
  document.getElementById('inputCnpj').value = c.cnpj||'';
  document.getElementById('inputTel').value = c.tel||'';
  document.getElementById('formTitle').textContent = 'Editar Empresa';
  window.scrollTo({top:0,behavior:'smooth'});
}

function excluir(id) {
  const c = DB.get('companies').find(x=>x.id===id);
  if (!confirm(`Excluir "${c?.name}"?`)) return;
  DB.set('companies', DB.get('companies').filter(x=>x.id!==id));
  logAudit('Empresa excluída', c?.name||'');
  toast('Empresa excluída', 'error');
  render();
}

function limpar() {
  ['editId','inputNome','inputEndereco','inputCnpj','inputTel'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('formTitle').textContent = 'Nova Empresa';
}
</script>
</body>
</html>
