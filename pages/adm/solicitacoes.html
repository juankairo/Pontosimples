<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10' stroke='%230b1d4d' stroke-width='2.5'/%3E%3Cpolyline points='12 6 12 12 16 14'/%3E%3C/svg%3E">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitações - Ponto Eletrônico</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/app.js"></script>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main-content">
  <div id="topbar-container"></div>

  <div class="panel">
    <div class="panel-header">
      <h2>Solicitações de Acesso</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-success btn-sm" onclick="aprovarSelecionados()">✔ Aprovar Selecionados</button>
        <button class="btn btn-danger btn-sm" onclick="recusarSelecionados()">✖ Recusar Selecionados</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th><label class="checkbox-wrap"><input type="checkbox" id="selectAll" onchange="toggleAll(this)"></label></th>
          <th>Nome</th><th>E-mail</th><th>Data</th><th>Ações</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <p>Nenhuma solicitação pendente</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header"><h2>Histórico de Solicitações</h2></div>
    <table>
      <thead>
        <tr><th>Nome</th><th>E-mail</th><th>Data Cadastro</th><th>Status</th></tr>
      </thead>
      <tbody id="histBody"></tbody>
    </table>
  </div>
</div>

<!-- Modal de Simulação de Envio de E-mail -->
<div class="modal-overlay" id="emailModal" style="z-index: 1000; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; right: 0; bottom: 0;">
  <div class="modal" style="max-width: 440px; text-align: center; padding: 30px; border-radius: var(--radius); background: var(--white); border: 1.5px solid var(--border);">
    <div style="font-size: 40px; margin-bottom: 16px;">✉️</div>
    <h3 style="font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 10px;">Simulação de Envio de E-mail</h3>
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;" id="emailModalText"></p>
    <div style="background: #f1f5f9; border-radius: 8px; padding: 16px; text-align: left; font-size: 12.5px; border-left: 4px solid var(--accent); margin-bottom: 24px; line-height: 1.5;" id="emailModalContent">
    </div>
    <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="closeEmailModal()">Confirmar e Fechar</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  renderTopbar('Solicitações de Acesso', 'Usuários aguardando aprovação');
  render();
});

function render() {
  const users = DB.get('users');
  const pending = users.filter(u=>u.status==='pendente');
  const hist = users.filter(u=>['ativo','recusado'].includes(u.status));

  if (!pending.length) {
    document.querySelector('table').style.display='none';
    document.getElementById('emptyState').style.display='block';
  } else {
    document.querySelector('table').style.display='table';
    document.getElementById('emptyState').style.display='none';
  }

  document.getElementById('tableBody').innerHTML = pending.map(u=>`
    <tr>
      <td><label class="checkbox-wrap"><input type="checkbox" class="sel-check" value="${u.id}"></label></td>
      <td><div class="employee">
        <div class="avatar avatar-md">${avatar(u.name)}</div>
        <div class="emp-name">${u.name}</div>
      </div></td>
      <td>${u.email}</td>
      <td>${fmtDate(u.createdAt)}</td>
      <td>
        <div style="display:flex;gap:6px">
          <button class="btn btn-success btn-sm" onclick="aprovar(${u.id})">✔ Aceitar</button>
          <button class="btn btn-danger btn-sm" onclick="recusar(${u.id})">✖ Recusar</button>
        </div>
      </td>
    </tr>`).join('');

  document.getElementById('histBody').innerHTML = hist.map(u=>`
    <tr>
      <td><div class="employee">
        <div class="avatar avatar-md">${avatar(u.name)}</div>
        <div class="emp-name">${u.name}</div>
      </div></td>
      <td>${u.email}</td>
      <td>${fmtDate(u.createdAt)}</td>
      <td><span class="status-badge ${u.status==='ativo'?'status-ativo':'status-inativo'}">${u.status==='ativo'?'Aprovado':'Recusado'}</span></td>
    </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:20px">Nenhum histórico</td></tr>';
}

function toggleAll(cb) {
  document.querySelectorAll('.sel-check').forEach(c=>c.checked=cb.checked);
}

function getSelected() {
  return [...document.querySelectorAll('.sel-check:checked')].map(c=>parseInt(c.value));
}

function aprovar(id) {
  updateStatus([id], 'ativo');
  toast('Usuário aprovado! E-mail enviado.', 'success');
}

function recusar(id) {
  updateStatus([id], 'recusado');
  toast('Usuário recusado. E-mail de notificação enviado.', 'error');
}

function aprovarSelecionados() {
  const ids = getSelected();
  if (!ids.length) { toast('Selecione ao menos um usuário', 'warning'); return; }
  updateStatus(ids, 'ativo');
  toast(`${ids.length} usuário(s) aprovado(s)! E-mails enviados.`, 'success');
}

function recusarSelecionados() {
  const ids = getSelected();
  if (!ids.length) { toast('Selecione ao menos um usuário', 'warning'); return; }
  updateStatus(ids, 'recusado');
  toast(`${ids.length} usuário(s) recusado(s).`, 'error');
}

function closeEmailModal() {
  document.getElementById('emailModal').style.display = 'none';
}

function updateStatus(ids, status) {
  const users = DB.get('users');
  const approvedUsers = [];
  ids.forEach(id => {
    const u = users.find(x=>x.id===id);
    if (u) {
      u.status = status;
      logAudit(status==='ativo'?'Usuário aprovado':'Usuário recusado', u.name);
      addNotification(`Usuário ${u.name} foi ${status==='ativo'?'aprovado':'recusado'}`);
      if (status === 'ativo') {
        approvedUsers.push(u);
      }
    }
  });
  DB.set('users', users);
  render();
  if (typeof renderSidebar === 'function') renderSidebar();

  if (approvedUsers.length > 0) {
    const names = approvedUsers.map(u => u.name).join(', ');
    const emails = approvedUsers.map(u => u.email).join(', ');
    
    document.getElementById('emailModalText').textContent = `Enviando e-mail para: ${emails}`;
    document.getElementById('emailModalContent').innerHTML = `
      <strong>De:</strong> nao-responder@pontoeletronico.com.br<br>
      <strong>Para:</strong> ${emails}<br>
      <strong>Assunto:</strong> Seu cadastro no Ponto Eletrônico foi aprovado!<br><br>
      Olá, <strong>${names}</strong>!<br><br>
      Informamos que a sua solicitação de acesso ao sistema <strong>Ponto Eletrônico</strong> foi analisada e <strong>aprovada</strong> com sucesso pelo administrador.<br><br>
      Você já pode realizar o login com seu e-mail cadastrado e a senha definida no momento do cadastro.<br><br>
      <a href="/pages/login/index.html" style="color:var(--accent); font-weight:700; text-decoration:none; display:inline-block; margin-top:8px;">👉 Clique aqui para acessar o sistema</a>
    `;
    document.getElementById('emailModal').style.display = 'flex';
  }
}
</script>
</body>
</html>
