<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10' stroke='%230b1d4d' stroke-width='2.5'/%3E%3Cpolyline points='12 6 12 12 16 14'/%3E%3C/svg%3E">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Ponto Eletrônico</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/assets/js/app.js"></script>
</head>
<body>
<div id="sidebar-container"></div>
<div class="main-content">
  <div id="topbar-container"></div>

  <div class="stats" id="statsRow"></div>

  <div class="charts-row">
    <div class="panel">
      <div class="panel-header"><h2>Horas Extras por Empresa</h2></div>
      <div class="chart-wrap"><canvas id="chartEmpresas"></canvas></div>
    </div>
    <div class="panel">
      <div class="panel-header"><h2>Presenças e Faltas do Mês</h2></div>
      <div class="chart-wrap"><canvas id="chartFreq"></canvas></div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:20px">
    <div class="panel-header"><h2>Registros Recentes</h2><span id="recCount"></span></div>
    <table>
      <thead>
        <tr><th>Funcionário</th><th>Data</th><th>Entrada</th><th>Saída</th><th>Horas</th><th>Extra</th><th>Status</th></tr>
      </thead>
      <tbody id="recBody"></tbody>
    </table>
  </div>

  <div class="panel">
    <div class="panel-header"><h2>Usuários do Sistema</h2><span id="usersCount"></span></div>
    <div class="users-grid" id="usersGrid"></div>
  </div>
</div>

<!-- Modal de Exibição de Avisos do Sistema -->
<div class="modal-overlay" id="announcementModal" style="z-index: 1000; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; right: 0; bottom: 0;">
  <div class="modal" style="max-width: 460px; padding: 30px; border-radius: var(--radius); background: var(--white); border: 1.5px solid var(--border);">
    <div style="font-size: 40px; text-align: center; margin-bottom: 16px;">📢</div>
    <h3 style="font-size: 19px; font-weight: 800; color: var(--primary); margin-bottom: 4px; text-align: center;" id="annTitle">Aviso Importante</h3>
    <div style="font-size: 11px; color: var(--text-muted); text-align: center; margin-bottom: 16px;" id="annMeta"></div>
    <div style="font-size: 14px; color: var(--text); line-height: 1.6; max-height: 180px; overflow-y: auto; margin-bottom: 24px; padding: 12px; background: #f8fafc; border-radius: 8px; border-left: 4px solid var(--accent); text-align: left;" id="annContent">
    </div>
    <button class="btn btn-primary" style="width: 100%; justify-content: center;" id="btnDismissAnn">Marcar como Lido & Fechar</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = getCurrentUser() || { name: 'Usuário' };
  renderTopbar('Dashboard', 'Bem-vindo, ' + user.name);
  buildStats();
  buildRecords();
  buildUsers();
  buildCharts();
  checkAnnouncements(); // Verificar avisos importantes ao carregar o sistema
});

function checkAnnouncements() {
  const currentUser = getCurrentUser();
  if (!currentUser) return;
  
  const announcements = DB.get('announcements') || [];
  const read = JSON.parse(localStorage.getItem('sp_read_announcements_' + currentUser.id) || '[]');
  
  // Filtrar avisos direcionados para o usuário atual (filtro individual por funcionário)
  const matching = announcements.filter(a => {
    if (read.includes(a.id)) return false;
    
    // Verifica se o id do usuário logado está na lista de destinatários do aviso
    if (!a.userIds || !a.userIds.includes(currentUser.id)) return false;
    
    return true;
  });
  
  if (matching.length > 0) {
    const active = matching[0];
    
    document.getElementById('annTitle').textContent = active.title;
    document.getElementById('annMeta').textContent = `Publicado em: ${active.date}`;
    document.getElementById('annContent').textContent = active.content;
    
    const btn = document.getElementById('btnDismissAnn');
    btn.onclick = () => {
      read.push(active.id);
      localStorage.setItem('sp_read_announcements_' + currentUser.id, JSON.stringify(read));
      document.getElementById('announcementModal').style.display = 'none';
      checkAnnouncements(); // Verifica se há mais avisos não lidos
    };
    
    document.getElementById('announcementModal').style.display = 'flex';
  }
}

function buildStats() {
  const currentUser = getCurrentUser() || { role: 'funcionario', id: 1 };
  const users = DB.get('users');
  const bank = DB.get('bank');
  const records = DB.get('records');
  const fullMe = users.find(u => u.id === currentUser.id) || currentUser;

  let activeUsersList = users;
  let bankList = bank;

  if (currentUser.role === 'supervisor') {
    const sectorId = fullMe.sectorId;
    activeUsersList = users.filter(u => u.sectorId === sectorId);
    const teamIds = activeUsersList.map(u => u.id);
    bankList = bank.filter(b => teamIds.includes(b.userId));
  } else if (currentUser.role === 'funcionario') {
    activeUsersList = users.filter(u => u.sectorId === fullMe.sectorId);
    bankList = bank.filter(b => b.userId === currentUser.id);
  }

  const ativos = activeUsersList.filter(u=>u.status==='ativo').length;
  const pendentes = users.filter(u=>u.status==='pendente').length;

  let totalOvMin = 0;
  bankList.filter(b=>b.type==='Hora Extra').forEach(b=>{
    const m = b.hours.replace(/[+\-h]/g,':').split(':');
    totalOvMin += (parseInt(m[1]||0)*60)+(parseInt(m[2]||0));
  });
  const ovH = Math.floor(totalOvMin/60), ovM = totalOvMin%60;
  const ovStr = `${ovH}h${ovM.toString().padStart(2,'0')}`;

  let card1, card2, card3;

  if (currentUser.role === 'funcionario') {
    card1 = statCard('Minha Equipe', ativos + ' ativos', 'Colegas no setor', 'blue', '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><circle cx="17.5" cy="8.5" r="2.7"/><path d="M16 13.7c2.7.3 4.8 2.7 4.8 5.6"/>');
    card2 = statCard('Minhas Horas Extras', ovStr, 'Acumulado pessoal', 'green', '<path d="M3 17l5-5 4 4 8-9"/><path d="M16 6h4v4"/>');
    card3 = statCard('Registrar Ponto', 'Bater Ponto', 'Ir para Cartão de Ponto', 'orange', '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>', 'location.href="/pages/adm/cartao-ponto.html"');
  } else if (currentUser.role === 'supervisor') {
    card1 = statCard('Equipe Ativa', ativos, 'Funcionários no setor', 'blue', '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><circle cx="17.5" cy="8.5" r="2.7"/><path d="M16 13.7c2.7.3 4.8 2.7 4.8 5.6"/>');
    card2 = statCard('Extras da Equipe', ovStr, 'Acumulado do setor', 'green', '<path d="M3 17l5-5 4 4 8-9"/><path d="M16 6h4v4"/>');
    card3 = statCard('Setor Responsável', getSectorName(fullMe.sectorId), getCompanyName(fullMe.companyId), 'orange', '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>');
  } else {
    card1 = statCard('Usuários Ativos', ativos, 'Total cadastrado', 'blue', '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><circle cx="17.5" cy="8.5" r="2.7"/><path d="M16 13.7c2.7.3 4.8 2.7 4.8 5.6"/>');
    card2 = statCard('Horas Extras Totais', ovStr, 'Acumuladas aprovadas', 'green', '<path d="M3 17l5-5 4 4 8-9"/><path d="M16 6h4v4"/>');
    card3 = statCard('Solicitações', pendentes, 'Aguardando aprovação', 'orange', '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>', 'location.href="/pages/adm/solicitacoes.html"');
  }

  document.getElementById('statsRow').innerHTML = card1 + card2 + card3;
}

function statCard(title, val, desc, color, svg, onclick='') {
  return `
  <div class="stat-card" ${onclick?`onclick="${onclick}" style="cursor:pointer;"`:''}>
    <div style="flex:1">
      <div class="lbl">${title}</div>
      <div class="val">${val}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px">${desc}</div>
    </div>
    <div class="stat-icon stat-icon-${color}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${svg}</svg>
    </div>
  </div>`;
}

function buildRecords() {
  const currentUser = getCurrentUser() || { role: 'funcionario', id: 1 };
  const users = DB.get('users');
  const records = DB.get('records');
  const fullMe = users.find(u => u.id === currentUser.id) || currentUser;

  let teamIds = users.map(u => u.id);
  if (currentUser.role === 'supervisor' || currentUser.role === 'funcionario') {
    teamIds = users.filter(u => u.sectorId === fullMe.sectorId).map(u => u.id);
  }

  const recs = records.filter(r => teamIds.includes(r.userId)).slice(0, 10);
  document.getElementById('recCount').textContent = recs.length + ' recentes';

  document.getElementById('recBody').innerHTML = recs.map(r => {
    const emp = users.find(u => u.id === r.userId) || { name: 'Desconhecido' };
    return `
    <tr>
      <td><div class="employee">
        <div class="avatar avatar-sm">${avatar(emp.name)}</div>
        <div class="emp-name">${emp.name}</div>
      </div></td>
      <td>${fmtDate(r.date)}</td>
      <td>${r.in1||'—'}</td>
      <td>${r.out2||'—'}</td>
      <td>${r.hoursWorked||'—'}</td>
      <td style="color:${r.overtime&&r.overtime!=='0h00'?'var(--success)':'inherit'}">${r.overtime||'—'}</td>
      <td><span class="status-badge status-${r.status}">${r.status}</span></td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:24px">Nenhum registro de ponto encontrado</td></tr>';
}

function buildUsers() {
  const currentUser = getCurrentUser() || { role: 'funcionario', id: 1 };
  const users = DB.get('users');
  const fullMe = users.find(u => u.id === currentUser.id) || currentUser;

  let teamList = users;
  if (currentUser.role === 'supervisor' || currentUser.role === 'funcionario') {
    teamList = users.filter(u => u.sectorId === fullMe.sectorId);
  }

  const list = teamList.filter(u => u.status === 'ativo').slice(0, 12);
  document.getElementById('usersCount').textContent = list.length + ' ativos';

  document.getElementById('usersGrid').innerHTML = list.map(u => `
    <div class="user-card">
      <div class="avatar avatar-lg" style="margin: 0 auto 12px auto">${avatar(u.name)}</div>
      <div style="font-weight:700;font-size:14px;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.name}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${getSectorName(u.sectorId)}</div>
    </div>`).join('') || '<div class="empty-state" style="padding:24px;grid-column:1/-1;"><p>Nenhum usuário cadastrado</p></div>';
}

function buildCharts() {
  const currentUser = getCurrentUser() || { role: 'funcionario', id: 1 };
  const bank = DB.get('bank');
  const companies = DB.get('companies');
  const users = DB.get('users');
  const fullMe = users.find(u => u.id === currentUser.id) || currentUser;

  let teamIds = users.map(u => u.id);
  if (currentUser.role === 'supervisor' || currentUser.role === 'funcionario') {
    teamIds = users.filter(u => u.sectorId === fullMe.sectorId).map(u => u.id);
  }

  const ovByComp = {};
  companies.forEach(c=>ovByComp[c.name]=0);
  
  bank.filter(b=>b.type==='Hora Extra' && teamIds.includes(b.userId)).forEach(b=>{
    const u = users.find(x=>x.id===b.userId);
    if (u && u.companyId) {
      const c = companies.find(x=>x.id===u.companyId);
      if (c) {
        const m = b.hours.replace(/[+h]/g,':').split(':');
        ovByComp[c.name] = (ovByComp[c.name]||0) + parseInt(m[1]||0)*60 + parseInt(m[2]||0);
      }
    }
  });

  const canvas1 = document.getElementById('chartEmpresas');
  if (canvas1) {
    new Chart(canvas1, {
      type: 'bar',
      data: {
        labels: Object.keys(ovByComp),
        datasets: [{ label:'Horas Extras (min)', data: Object.values(ovByComp), backgroundColor:'#2563EB', borderRadius:6 }]
      },
      options: { responsive:true, plugins:{ legend:{display:false} }, scales:{ y:{ beginAtZero:true } } }
    });
  }

  const records = DB.get('records').filter(r => teamIds.includes(r.userId));
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const presences = new Array(daysInMonth).fill(0);
  const absences = new Array(daysInMonth).fill(0);
  records.forEach(r => {
    const d = new Date(r.date);
    if (d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear()) {
      presences[d.getDate()-1]++;
    }
  });
  const labels = Array.from({length:daysInMonth},(_,i)=>i+1);
  
  const canvas2 = document.getElementById('chartFreq');
  if (canvas2) {
    new Chart(canvas2, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label:'Presenças', data:presences, borderColor:'#16a34a', backgroundColor:'rgba(22,163,74,.1)', fill:true, tension:.4 },
          { label:'Faltas', data:absences, borderColor:'#dc2626', backgroundColor:'rgba(220,38,38,.1)', fill:true, tension:.4 }
        ]
      },
      options: { responsive:true, plugins:{ legend:{ position:'bottom' } }, scales:{ y:{ beginAtZero:true } } }
    });
  }
}
</script>
</body>
</html>
